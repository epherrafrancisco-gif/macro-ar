name: Historia

# Cierres diarios de BYMA (acciones, bonos, CEDEARs, Merval), MEP propio y CER → historia.json
# (Simulador de inversión histórica). Días hábiles a las 18:35 (hora argentina), con el mercado cerrado.
on:
  schedule:
    - cron: "35 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/historia.py

permissions:
  contents: write

concurrency:
  group: historia
  cancel-in-progress: false

jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer la historia de precios
        run: python scripts/historia.py

      - name: Guardar cambios
        run: |
          git add -A historia.json historia/
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "macro-ar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Historia $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git pull --rebase origin main
          git push
