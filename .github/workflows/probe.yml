name: Probe
on:
  push:
    branches: [main]
    paths: [scripts/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/probe.py
      - run: |
          git config user.name "macro-ar-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe.json; git commit -m "probe"; git pull --rebase origin main; git push
