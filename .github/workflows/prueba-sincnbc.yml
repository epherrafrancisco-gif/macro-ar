name: Prueba sin CNBC (temporal)
# Corre todos los robots en la rama sin-cnbc y guarda los JSON y un resumen ahí mismo. No toca main. Se borra al publicar.
on:
  push:
    branches: [sin-cnbc]
    paths: [.github/workflows/prueba-sincnbc.yml, scripts/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: prueba-sincnbc, cancel-in-progress: true}
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xlrd==2.0.1 openpyxl==3.1.5
      - name: Correr cada robot
        shell: bash
        run: |
          set +e
          : > resumen.txt
          for s in update global usa noticias noticias_paises ganaderia actividad geopolitica paises_extra brasil europa mexico chile japon reinounido canada colombia turquia peru polonia india arabia suiza australia corea sudafrica zelanda indonesia noruega suecia tailandia malasia filipinas islandia hungria hongkong chequia dinamarca rumania israel serbia china rusia espana singapur marruecos macedonia; do
            a=$(date +%s)
            if [ "$s" = update ]; then timeout 900 python scripts/update.py --dias 10 > out.txt 2>&1; else timeout 900 python scripts/$s.py > out.txt 2>&1; fi
            echo "== $s salida $? ($(( $(date +%s) - a )) s)" >> resumen.txt
            grep -i "error\|traceback\|403\|forbidden\|429\|exception" out.txt | head -12 >> resumen.txt
          done
          python - <<'PY' >> resumen.txt
          import json
          e = json.load(open("estado.json")); print("estado", json.dumps(e, ensure_ascii=False)[:2500])
          d = json.load(open("data.json")); dd = d.get("diario") or []
          print("ultimos diario", json.dumps(dd[-2:], ensure_ascii=False)[:1500])
          g = json.load(open("global.json")); print("global abiertas", g.get("abiertas"), "errores", g.get("errores"))
          u = json.load(open("usa.json")); print("usa errores", u.get("errores"))
          PY
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A -- '*.json' resumen.txt diario || true
          git commit -m "Prueba sin CNBC: datos y resumen [skip ci]" && git push || echo "nada para guardar"
