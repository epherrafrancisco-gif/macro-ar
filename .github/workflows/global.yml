name: Global

# Arma global.json (pestaña Global y cinta de mercados del mundo).
# Días hábiles: cada hora de 8 a 19 (hora argentina). Fines de semana: cada 6 horas (bitcoin).
on:
  schedule:
    - cron: "23 11-22 * * 1-5"
    - cron: "23 */6 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/global.py
      - scripts/usa.py
      - scripts/brasil.py
      - scripts/europa.py
      - scripts/mexico.py
      - scripts/chile.py
      - scripts/japon.py
      - scripts/reinounido.py
      - .github/workflows/global.yml

permissions:
  contents: write

concurrency:
  group: global
  cancel-in-progress: false

jobs:
  global:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos del mundo
        run: python scripts/global.py

      - name: Traer datos de Estados Unidos
        run: python scripts/usa.py
        env:
          BEA_KEY: ${{ secrets.BEA_KEY }}
        continue-on-error: true

      - name: Traer datos de Brasil
        run: python scripts/brasil.py
        continue-on-error: true

      - name: Traer datos de Europa
        run: python scripts/europa.py
        continue-on-error: true

      - name: Traer datos de México
        run: python scripts/mexico.py
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        continue-on-error: true

      - name: Traer datos de Chile
        run: python scripts/chile.py
        continue-on-error: true

      - name: Traer datos de Japón
        run: python scripts/japon.py
        continue-on-error: true

      - name: Traer datos de Reino Unido
        run: python scripts/reinounido.py
        continue-on-error: true

      - name: Guardar cambios
        run: |
          if git diff --quiet global.json global_hist.json usa.json brasil.json europa.json mexico.json chile.json japon.json reinounido.json 2>/dev/null && git ls-files --error-unmatch global.json global_hist.json usa.json brasil.json europa.json mexico.json chile.json japon.json reinounido.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "macro-ar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global.json; git add global_hist.json usa.json brasil.json europa.json mexico.json chile.json japon.json reinounido.json 2>/dev/null || true
          git commit -m "Global $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git pull --rebase origin main
          git push
