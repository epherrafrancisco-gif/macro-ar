name: Global

# Arma global.json (pestaña Global y cinta de mercados del mundo).
# Días hábiles: cada hora de 8 a 19 (hora argentina). Fines de semana: cada 6 horas (bitcoin).
on:
  schedule:
    - cron: "23 11-22 * * 1-5"
    - cron: "23 */6 * * 0,6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/global.py
      - scripts/usa.py
      - scripts/brasil.py
      - scripts/europa.py
      - scripts/mexico.py
      - scripts/chile.py
      - scripts/japon.py
      - scripts/reinounido.py
      - scripts/canada.py
      - scripts/colombia.py
      - scripts/turquia.py
      - scripts/peru.py
      - scripts/polonia.py
      - scripts/paises_extra.py
      - scripts/india.py
      - scripts/arabia.py
      - scripts/suiza.py
      - scripts/australia.py
      - scripts/corea.py
      - scripts/sudafrica.py
      - scripts/zelanda.py
      - scripts/indonesia.py
      - scripts/noruega.py
      - scripts/suecia.py
      - scripts/tailandia.py
      - scripts/malasia.py
      - scripts/filipinas.py
      - scripts/islandia.py
      - scripts/hungria.py
      - scripts/hongkong.py
      - scripts/chequia.py
      - scripts/dinamarca.py
      - scripts/rumania.py
      - scripts/israel.py
      - scripts/serbia.py
      - scripts/china.py
      - scripts/rusia.py
      - scripts/espana.py
      - scripts/macedonia.py
      - scripts/singapur.py
      - scripts/marruecos.py
      - scripts/geopolitica.py
      - scripts/pais_bis.py
      - scripts/abiertas.py
      - scripts/actividad.py
      - .github/workflows/global.yml

permissions:
  contents: write

concurrency:
  group: global
  cancel-in-progress: false

jobs:
  global:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos del mundo
        run: pip install -q xlrd==2.0.1 openpyxl==3.1.5 && python scripts/global.py

      - name: Traer datos de Estados Unidos
        run: python scripts/usa.py
        env:
          BEA_KEY: ${{ secrets.BEA_KEY }}
        continue-on-error: true

      - name: Traer datos de Brasil
        run: python scripts/brasil.py
        continue-on-error: true

      - name: Traer datos de Europa
        run: python scripts/europa.py
        continue-on-error: true

      - name: Traer datos de México
        run: python scripts/mexico.py
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        continue-on-error: true

      - name: Traer datos de Chile
        run: python scripts/chile.py
        continue-on-error: true

      - name: Traer datos de Japón
        run: python scripts/japon.py
        continue-on-error: true

      - name: Traer datos de Reino Unido
        run: python scripts/reinounido.py
        continue-on-error: true

      - name: Traer datos de Canadá
        run: python scripts/canada.py
        continue-on-error: true

      - name: Traer datos de Colombia
        run: python scripts/colombia.py
        continue-on-error: true

      - name: Traer datos de Turquía
        run: python scripts/turquia.py
        continue-on-error: true

      - name: Traer datos de Perú
        run: python scripts/peru.py
        continue-on-error: true

      - name: Traer datos de Polonia
        run: python scripts/polonia.py
        continue-on-error: true

      - name: Traer datos de India
        run: python scripts/india.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Arabia Saudita
        run: python scripts/arabia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Suiza
        run: python scripts/suiza.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Australia
        run: python scripts/australia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Corea del Sur
        run: python scripts/corea.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Sudáfrica
        run: python scripts/sudafrica.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Nueva Zelanda
        run: python scripts/zelanda.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Indonesia
        run: python scripts/indonesia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Noruega
        run: python scripts/noruega.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Suecia
        run: python scripts/suecia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Tailandia
        run: python scripts/tailandia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Malasia
        run: python scripts/malasia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Filipinas
        run: python scripts/filipinas.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Islandia
        run: python scripts/islandia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Hungría
        run: python scripts/hungria.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Hong Kong
        run: python scripts/hongkong.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Chequia
        run: python scripts/chequia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Dinamarca
        run: python scripts/dinamarca.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Rumania
        run: python scripts/rumania.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Israel
        run: python scripts/israel.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Serbia
        run: python scripts/serbia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de China
        run: python scripts/china.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Rusia
        run: python scripts/rusia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de España
        run: python scripts/espana.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Macedonia del Norte
        run: python scripts/macedonia.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Singapur
        run: python scripts/singapur.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de Marruecos
        run: python scripts/marruecos.py
        timeout-minutes: 3
        continue-on-error: true

      - name: Traer datos de geopolítica (conflictos, riesgo geopolítico, gasto militar)
        run: pip install -q xlrd==2.0.1 && python scripts/geopolitica.py
        timeout-minutes: 4
        continue-on-error: true

      - name: Traer datos que se suman a todos los países
        run: python scripts/paises_extra.py
        continue-on-error: true

      - name: Traer actividad, empleo e inflación por rubro de Argentina
        run: python scripts/actividad.py
        continue-on-error: true

      - name: Guardar cambios
        run: |
          if git diff --quiet global.json global_hist.json usa.json brasil.json europa.json mexico.json chile.json japon.json reinounido.json canada.json colombia.json turquia.json peru.json polonia.json paises_extra.json india.json arabia.json suiza.json australia.json corea.json sudafrica.json zelanda.json indonesia.json noruega.json suecia.json tailandia.json malasia.json filipinas.json islandia.json hungria.json hongkong.json chequia.json dinamarca.json rumania.json israel.json serbia.json china.json rusia.json espana.json macedonia.json singapur.json marruecos.json geopolitica.json actividad.json 2>/dev/null && git ls-files --error-unmatch global.json global_hist.json usa.json brasil.json europa.json mexico.json chile.json japon.json reinounido.json canada.json colombia.json turquia.json peru.json polonia.json paises_extra.json india.json arabia.json suiza.json australia.json corea.json sudafrica.json zelanda.json indonesia.json noruega.json suecia.json tailandia.json malasia.json filipinas.json islandia.json hungria.json hongkong.json chequia.json dinamarca.json rumania.json israel.json serbia.json china.json rusia.json espana.json macedonia.json singapur.json marruecos.json geopolitica.json actividad.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "macro-ar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global.json; git add global_hist.json usa.json brasil.json europa.json mexico.json chile.json japon.json reinounido.json canada.json colombia.json turquia.json peru.json polonia.json paises_extra.json india.json arabia.json suiza.json australia.json corea.json sudafrica.json zelanda.json indonesia.json noruega.json suecia.json tailandia.json malasia.json filipinas.json islandia.json hungria.json hongkong.json chequia.json dinamarca.json rumania.json israel.json serbia.json china.json rusia.json espana.json macedonia.json singapur.json marruecos.json geopolitica.json actividad.json 2>/dev/null || true
          git commit -m "Global $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git pull --rebase origin main
          git push
