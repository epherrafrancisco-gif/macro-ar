name: Verdadero o falso

# Arma verdadero-o-falso/datos.json (las preguntas de /verdadero-o-falso/) cada vez que termina otro robot,
# así siempre usan lo último. Solo lee los JSON del repo.
on:
  workflow_run:
    workflows: ["Actualizar datos", "Global", "Historia"]
    types: [completed]
  schedule:
    - cron: "50 3 * * *"   # 00:50 ART, por si algo se perdió
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/verdadero.py

permissions:
  contents: write

concurrency:
  group: verdadero
  cancel-in-progress: false

jobs:
  verdadero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Armar los datos de las preguntas
        run: python scripts/verdadero.py

      - name: Guardar cambios
        run: |
          git add verdadero-o-falso/datos.json verdadero-o-falso/portada.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verdadero o falso: datos de las preguntas"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
