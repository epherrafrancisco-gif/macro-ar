name: Vinos

# Vino y uva: datos abiertos del INV (datos.gob.ar) y precio del vino común (INDEC) → vinos.json.
# Los CSV del INV salen pocas veces por año: alcanza con una vez por semana (lunes 9:17 hora argentina).
on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/vinos.py

permissions:
  contents: write

concurrency:
  group: vinos
  cancel-in-progress: false

jobs:
  vinos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos del INV
        run: python scripts/vinos.py

      - name: Guardar cambios
        run: |
          if git diff --quiet vinos.json 2>/dev/null && git ls-files --error-unmatch vinos.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "macro-ar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vinos.json
          git commit -m "Vinos $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git pull --rebase origin main
          git push
