name: Noticias

# Junta los titulares de economía de varios medios en noticias.json.
# Días hábiles: cada hora de 6 a 22 (hora argentina). Fines de semana: cada 3 horas.
on:
  schedule:
    - cron: "7 9-23 * * 1-5"    # 06:07 a 20:07 ART, lunes a viernes
    - cron: "7 0,1 * * 2-6"     # 21:07 y 22:07 ART, lunes a viernes
    - cron: "7 12-23/3 * * 0,6" # 09:07, 12:07, 15:07 y 18:07 ART, sábados y domingos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer titulares
        run: python scripts/noticias.py

      - name: Guardar cambios
        run: |
          if git diff --quiet noticias.json 2>/dev/null && git ls-files --error-unmatch noticias.json >/dev/null 2>&1; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "macro-ar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Noticias $(TZ=America/Argentina/Buenos_Aires date +'%d/%m %H:%M')"
          git pull --rebase origin main
          git push
