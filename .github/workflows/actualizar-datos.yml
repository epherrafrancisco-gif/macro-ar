name: Actualizar datos

on:
  schedule:
    # Horarios en UTC (Buenos Aires = UTC-3), de lunes a viernes.
    - cron: "47 21 * * 1-5"   # 18:47 ART, después del cierre
    - cron: "15 13 * * 1-5"   # 10:15 ART, completa lo que el BCRA publica con atraso
    - cron: "30 14 * * 1-5"   # 11:30 ART, media hora después de la apertura (dólares y riesgo país)
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer datos nuevos
        run: python scripts/update.py --dias 10

      - name: Ver si cambiaron los datos
        id: cambios
        run: |
          if git diff --quiet data.json; then
            echo "Sin cambios en data.json"
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      # Imagen del día para redes (diario/hoy.png y diario/texto.txt). Si falla,
      # los datos se guardan igual.
      - name: Generar imagen del día
        if: steps.cambios.outputs.hay == 'si'
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1 >/dev/null
          if ! command -v google-chrome >/dev/null; then
            npx -y playwright@1 install chromium >/dev/null
            export CHROME_PATH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | head -1)
          fi
          node scripts/diario.mjs

      - name: Guardar cambios
        if: steps.cambios.outputs.hay == 'si'
        run: |
          FECHA=$(python -c "import json;print(json.load(open('data.json'))['actualizado'])")
          git config user.name "macro-ar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json estado.json
          git add diario/hoy.png diario/texto.txt 2>/dev/null || true
          git commit -m "Datos al ${FECHA}"
          git pull --rebase origin main
          git push
