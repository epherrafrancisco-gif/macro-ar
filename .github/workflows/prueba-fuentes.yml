name: Prueba de fuentes (temporal)
on:
  push:
    branches: [prueba-fuentes]
    paths-ignore: [global.json, global_hist.json, usa.json, resumen.txt, resumen2.txt, index.html]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q xlrd==2.0.1 openpyxl==3.1.5
      - name: Correr cada robot con el user-agent nuevo
        run: |
          : > resumen2.txt
          for s in update noticias noticias_paises ganaderia actividad geopolitica global usa brasil europa mexico chile japon reinounido canada colombia turquia peru polonia paises_extra india noruega; do
            echo "== $s" >> resumen2.txt
            timeout 600 python scripts/$s.py > out_$s.txt 2>&1; echo "salida $?" >> resumen2.txt
            grep -i "error\|warn\|traceback\|403\|forbidden" out_$s.txt | head -25 >> resumen2.txt || true
          done
          python - <<'PY' >> resumen2.txt
          import json
          e = json.load(open("estado.json")); print("estado.json", json.dumps(e, ensure_ascii=False)[:3000])
          n = json.load(open("noticias.json")); print("noticias fuentes", n.get("fuentes"))
          g = json.load(open("ganaderia.json")); print("ganaderia", {k: g.get(k) for k in ("actualizado","errores","diag") if k in g})
          PY
      - name: Guardar en la rama de prueba
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f resumen2.txt
          git commit -m "Resultado de la prueba 2 [skip ci]" && git push
