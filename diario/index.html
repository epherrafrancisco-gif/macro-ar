<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Macro AR · imagen del día</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f7a'/%3E%3Cpath d='M6 22l6-7 5 4 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script data-goatcounter="https://macroar.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#f2f4f6;--surface:#fff;--ink:#131c26;--ink2:#485563;--muted:#788593;--line:#dbe1e7;--accent:#1d4f7a;--accent-ink:#fff;--pos:#1f7a4d;
  --sans:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1319;--surface:#161d25;--ink:#e6edf3;--ink2:#a9b6c3;--muted:#7c8a98;--line:#28323d;--accent:#6aa8d8;--accent-ink:#0e1319;--pos:#4cc38a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1319;--surface:#161d25;--ink:#e6edf3;--ink2:#a9b6c3;--muted:#7c8a98;--line:#28323d;--accent:#6aa8d8;--accent-ink:#0e1319;--pos:#4cc38a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:18px}
h1{margin:0;font-size:24px}
h1 a{color:inherit;text-decoration:none}
p{margin:0;color:var(--ink2);font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:13.5px;line-height:1.55;background:var(--bg);border-radius:8px;padding:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button,a.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none}
.primary{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.ok{color:var(--pos);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div><h1><a href="../">Macro AR</a> · imagen del día</h1>
  <p>Se genera sola con cada actualización de datos (10:15, 11:30 y 18:47). La de las 18:47 es la de cierre.</p></div>
  <div class="grid">
    <a href="hoy.png" id="lnk"><img id="img" src="hoy.png" alt="Resumen del día de Macro AR: dólares, brechas, riesgo país, reservas, compras del BCRA y Merval"></a>
    <div class="card">
      <div class="btns">
        <a class="btn primary" id="dl" href="hoy.png" download="macro-ar-diario.png">Descargar imagen</a>
        <button type="button" id="cp">Copiar texto</button>
        <span class="ok" id="okc" hidden>Copiado</span>
      </div>
      <pre id="tx">Cargando…</pre>
      <p>En el celular: tocá la imagen y mantené apretado para guardarla en la galería.</p>
    </div>
  </div>
</div>
<script>
(async()=>{
  const v = Date.now();
  for(const id of ['img']) document.getElementById(id).src = 'hoy.png?v='+v;
  document.getElementById('lnk').href = document.getElementById('dl').href = 'hoy.png?v='+v;
  let txt = '';
  try{ txt = (await (await fetch('texto.txt?v='+v, {cache:'no-store'})).text()).trim(); }catch(e){}
  document.getElementById('tx').textContent = txt || 'Todavía no hay texto generado.';
  const m = txt.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(m) document.getElementById('dl').download = `macro-ar-${m[3]}-${m[2]}-${m[1]}.png`;
  document.getElementById('cp').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(txt); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('tx')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); }
    const ok=document.getElementById('okc'); ok.hidden=false; setTimeout(()=>ok.hidden=true, 2000);
  });
})();
</script>
</body>
</html>
