<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pulso Live · Pulso Macro</title>
<meta name="description" content="Pulso Live: la economía de Argentina y el mundo en reels. Datos reales, uno atrás de otro: dólares, Merval, inflación, países, trivia y verdadero o falso.">
<link rel="icon" href="/icons/anillo.svg" type="image/svg+xml">
<link rel="canonical" href="https://pulsomacro.com.ar/live/">
<meta property="og:title" content="Pulso Live · Pulso Macro">
<meta property="og:description" content="La economía de Argentina y el mundo, en reels. Datos reales, uno atrás de otro.">
<meta property="og:image" content="https://pulsomacro.com.ar/preview.png">
<script>try{if(!localStorage.getItem("skipgc"))document.write('<script data-goatcounter="https://macroar.goatcounter.com/count" async src="//gc.zgo.at/count.js"><\/script>')}catch(e){}</script>
<style>
[hidden]{display:none!important}
:root{
  --bg:#0e1319; --bg2:#121922; --line:#233040; --fg:#e6edf3; --mut:#8b9bb0; --dim:#5d6b7d;
  --acc:#6aa8d8; --up:#2fbf7a; --dn:#e5534b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg);overscroll-behavior:none}
:root{padding:0!important}
body{margin:0;font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}

/* ---------- barra de arriba ---------- */
.top{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(#0e1319f2,#0e131900);pointer-events:none}
.top>*{pointer-events:auto}
.back{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px}
.back svg.lg{width:22px;height:22px}
.back .ar{width:16px;height:16px;color:var(--mut)}
.back span{font-family:var(--mono);color:var(--acc);font-weight:500}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:#bfe9d3;border:1px solid #2fbf7a55;background:#2fbf7a14;border-radius:99px;padding:5px 10px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 #2fbf7a88;animation:lat 1.8s infinite}
@keyframes lat{0%{box-shadow:0 0 0 0 #2fbf7a88}70%{box-shadow:0 0 0 7px #2fbf7a00}100%{box-shadow:0 0 0 0 #2fbf7a00}}
.cnt{font-family:var(--mono);font-size:11px;color:var(--mut)}

/* ---------- el feed ---------- */
#feed{position:fixed;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  --c:var(--acc);background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 62%),
  radial-gradient(90% 50% at 100% 100%,color-mix(in srgb,var(--c) 10%,transparent),transparent 70%),var(--bg)}
.c-arg{--c:#6aa8d8}.c-mer{--c:#d95926}.c-mun{--c:#199e70}.c-his{--c:#c98500}.c-tri{--c:#d55181}.c-age{--c:#3987e5}.c-not{--c:#8b9bb0}
.rin{position:absolute;inset:0;margin:0 auto;max-width:520px;display:flex;flex-direction:column;gap:14px;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(92px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  padding-right:max(76px,env(safe-area-inset-right,0px))}
.kick{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.kick img{width:24px;height:18px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px #ffffff1f}
.kick b{color:var(--c);font-weight:500}
.tit{margin:0;font-size:clamp(24px,6.6vw,32px);line-height:1.16;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.big{font-family:var(--mono);font-weight:500;font-size:clamp(46px,14vw,76px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.big small{font-size:.42em;color:var(--mut);letter-spacing:0;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:13px;padding:5px 10px;border-radius:7px;background:#ffffff0d;border:1px solid #ffffff12}
.chip.up{color:var(--up);background:#2fbf7a14;border-color:#2fbf7a33}.chip.dn{color:var(--dn);background:#e5534b14;border-color:#e5534b33}
.viz{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.nota{margin:0;font-size:15px;line-height:1.45;color:#c4cfdb;text-wrap:pretty}
.src{font-size:11.5px;color:var(--dim);line-height:1.4}

/* línea */
.ln{position:relative;flex:1;min-height:120px;max-height:300px}
.ln svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ln .p{fill:none;stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.ln .ar{opacity:0;transition:opacity .9s .6s}
.on .ln .p{animation:dib 1.3s cubic-bezier(.3,.7,.3,1) forwards}
.on .ln .ar{opacity:1}
@keyframes dib{to{stroke-dashoffset:0}}
.lnl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim)}
.ley{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#c4cfdb}
.ley i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* barras */
.bars{display:flex;flex-direction:column;gap:9px}
.br{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr) auto;align-items:center;gap:10px;font-size:14.5px}
.br .l{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .l img{width:20px;height:15px;border-radius:2px;flex:none;object-fit:cover}
.br .t{height:12px;border-radius:3px;background:#ffffff0b;position:relative;overflow:hidden}
.br .t i{position:absolute;inset:0 auto 0 0;width:0;border-radius:3px;background:color-mix(in srgb,var(--c) 70%,#fff 0%);transition:width 1s cubic-bezier(.3,.7,.3,1)}
.br .t i.neg{background:var(--dn)}
.br .v{font-family:var(--mono);font-size:13.5px;min-width:4.5em;text-align:right}
.br.hl .l{color:#fff;font-weight:600}.br.hl .t i{background:#fff}
.br.hl{background:#ffffff0a;margin:0 -8px;padding:4px 8px;border-radius:6px}
/* versus */
.vs{display:grid;gap:10px}
.vb{border:1px solid #ffffff14;border-radius:12px;padding:14px 16px;background:#0b1016a6;display:grid;gap:4px}
.vb .h{display:flex;align-items:center;gap:8px;font-size:14px;color:#c4cfdb}
.vb .h img{width:24px;height:18px;border-radius:3px;object-fit:cover}
.vb .n{font-family:var(--mono);font-size:clamp(34px,10vw,48px);letter-spacing:-.02em}
.vb .s{font-size:12px;color:var(--dim)}
.vb.w{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 10%,#0b1016)}
.vsx{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;letter-spacing:.2em}
/* antes / hoy */
.hace{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.hace .col{display:grid;gap:4px}
.hace .y{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.06em}
.hace .n{font-family:var(--mono);font-size:clamp(28px,8.4vw,40px)}
.hace .mul{font-family:var(--mono);font-size:15px;color:var(--c);padding-bottom:8px}
/* puntos (años) */
.dots{display:grid;gap:12px}
.dr{display:grid;gap:6px}
.dr .h{display:flex;align-items:center;gap:8px;font-size:14px}
.dr .h img{width:20px;height:15px;border-radius:2px;object-fit:cover}
.dr .h b{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:13px;color:var(--mut)}
.dr .q{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.dr .q i{aspect-ratio:1;border-radius:4px;background:#ffffff10;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:9px;color:#0e1319cc;transform:scale(.4);opacity:0;transition:transform .4s,opacity .4s}
.on .dr .q i{transform:none;opacity:1}
.dr .q i.u{background:var(--up)}.dr .q i.d{background:var(--dn)}
.dyr{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--dim);text-align:center}
/* trivia */
.quiz{display:grid;gap:10px}
.op{display:flex;align-items:center;gap:10px;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid #ffffff1f;background:#0b1016b3;cursor:pointer;font-size:16px;font-weight:500;transition:border-color .2s,background .2s}
.op img{width:24px;height:18px;border-radius:3px;object-fit:cover}
.op:hover{border-color:#ffffff40}
.op .r{margin-left:auto;font-family:var(--mono);font-size:14px;font-weight:400;opacity:0;transition:opacity .3s}
.quiz.ok .op{cursor:default}.quiz.ok .op .r{opacity:1}
.quiz.ok .op.si{border-color:var(--up);background:#2fbf7a1c}
.quiz.ok .op.mal{border-color:var(--dn);background:#e5534b14}
.quiz.ok .op:not(.si):not(.mal){opacity:.55}
.qres{font-size:15px;line-height:1.45;color:#c4cfdb;min-height:2.9em}
.qres b{color:#fff}
/* verdadero o falso */
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .op{justify-content:center;font-size:17px;padding:18px 10px}
.vf .op .r{display:none}
.vfa{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--mut)}
/* cuenta regresiva */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{border:1px solid #ffffff14;border-radius:10px;padding:12px 0 8px;text-align:center;background:#0b1016a6}
.cd b{display:block;font-family:var(--mono);font-weight:500;font-size:clamp(30px,9vw,42px)}
.cd span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ag{display:grid;gap:8px;margin-top:6px}
.ag div{display:flex;gap:10px;font-size:14px;color:#c4cfdb}
.ag div b{font-family:var(--mono);font-weight:500;color:var(--fg);min-width:4.6em}
/* noticia */
.nw{font-size:clamp(25px,7vw,34px);line-height:1.2;font-weight:600;text-wrap:balance;margin:0}
.nwm{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--mut)}
.nwb{align-self:flex-start;text-decoration:none;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid #ffffff26}
/* intro */
.intro .rin{justify-content:center;gap:18px}
.intro h1{margin:0;font-size:clamp(40px,12vw,64px);line-height:1;letter-spacing:-.03em}
.intro h1 span{font-family:var(--mono);color:var(--acc);font-weight:500}
.intro p{margin:0;font-size:17px;line-height:1.5;color:#c4cfdb;max-width:28em}
.intro .n{font-family:var(--mono);font-size:14px;color:var(--mut)}
.intro .n b{color:var(--fg);font-size:22px;font-weight:500}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats span{font-size:12.5px;padding:5px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--k) 55%,transparent);color:color-mix(in srgb,var(--k) 60%,#fff)}
.swipe{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);margin-top:10px}
.swipe svg{width:22px;height:22px;animation:sube 1.6s infinite}
@keyframes sube{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-4px);opacity:1}}

/* botones al costado, como en los reels */
.rail{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;z-index:5}
.rb{display:grid;justify-items:center;gap:4px;background:none;border:0;cursor:pointer;text-decoration:none;font-size:10.5px;color:#c4cfdb;padding:0}
.rb i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#0b1016b3;border:1px solid #ffffff1f}
.rb svg{width:21px;height:21px}
.rb:hover i{border-color:#ffffff55}
/* hint inferior y barra de categorías vistas */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(#0e131900,#0e1319e6)}
.foot .row{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.foot .bar{flex:1;height:3px;border-radius:2px;background:#ffffff12;overflow:hidden}
.foot .bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
/* compu: el reel es una columna al centro, flechas a la derecha */
.nav{position:fixed;right:max(24px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:20}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff26;background:#0b1016cc;cursor:pointer;display:grid;place-items:center}
.nav svg{width:18px;height:18px}
@media (hover:none){.nav{display:none}}
@media (min-width:760px){
  .rin{max-width:460px;padding-right:20px}
  .rail{right:calc(50% - 230px - 78px)}
  .reel::before{content:"";position:absolute;inset:0;margin:0 auto;max-width:460px;border-left:1px solid #ffffff0d;border-right:1px solid #ffffff0d}
}
@media (max-height:640px){.rin{gap:10px}.ln{min-height:90px}.tit{font-size:22px}}
/* modal para compartir */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#05080cd9;padding:16px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;max-width:min(420px,100%);max-height:100%;overflow:auto}
.modal img{width:100%;border-radius:8px;display:block}
.modal p{margin:0;font-size:13px;color:var(--mut);line-height:1.45}
.mbt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal button,.modal .mbt a{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#0e1319;cursor:pointer;text-decoration:none;font-size:14px}
.modal .mbt a{background:#6aa8d8;color:#0e1319;border-color:#6aa8d8;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ln .p{stroke-dashoffset:0}}
</style>
</head>
